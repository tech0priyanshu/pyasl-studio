name: PR Gateway

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-gateway-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Fetch PR head objects
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 "$PR_HEAD_REPOSITORY" "$PR_HEAD_SHA"
      - name: Install gateway and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pyyaml
      - name: Run PR Gateway
        run: PYTHONPATH=.github python -m pr_gateway --event "$GITHUB_EVENT_PATH" --policy .github/pr-gateway.yml --json > gateway-result.json
      - name: Publish gateway summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result_path = Path("gateway-result.json")
          if not result_path.exists():
              print("## PR Gateway: unavailable")
              print("Gateway result was not created because an earlier step failed.")
              raise SystemExit(0)
          result = json.loads(result_path.read_text())
          print(f"## PR Gateway: {result['status']}")
          print(f"Failures: {result.get('failures', 0)} | Warnings: {result.get('warnings', 0)}")
          for check in result.get("checks", []):
              print(f"- {check['status']}: {check['check_id']} {check['name']} - {check['message']}")
          PY